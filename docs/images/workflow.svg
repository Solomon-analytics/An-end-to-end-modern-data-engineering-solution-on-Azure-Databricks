<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="760" height="880" fill="#ffffff"/>

  <text x="30" y="38" font-size="19" font-weight="600" fill="#0f172a">Kestrel_ETL_Pipeline</text>
  <text x="30" y="58" font-size="12.5" fill="#64748b">Databricks Workflow · serverless · one batch per run · max concurrent runs 1</text>

  <!-- main spine arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M 250 132 L 250 156"/>
    <path d="M 250 218 L 250 242"/>
    <path d="M 250 304 L 250 328"/>
    <path d="M 250 390 L 250 414"/>
    <path d="M 250 476 L 250 500"/>
    <path d="M 250 562 L 250 586"/>
    <path d="M 250 648 L 250 672"/>
    <path d="M 250 734 L 250 758"/>
  </g>

  <!-- condition false branch -->
  <path d="M 380 187 L 520 187" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <text x="400" y="180" font-size="11" fill="#16a34a" font-weight="600">false</text>
  <text x="258" y="236" font-size="11" fill="#16a34a" font-weight="600">true</text>

  <!-- failure branches -->
  <g stroke="#dc2626" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#af)">
    <path d="M 380 354 C 470 354 500 400 560 448"/>
    <path d="M 380 440 C 470 440 500 450 560 460"/>
    <path d="M 380 526 C 470 526 500 500 560 478"/>
    <path d="M 380 612 C 470 612 505 540 560 490"/>
    <path d="M 380 698 C 480 698 510 560 560 500"/>
  </g>

  <!-- boxes -->
  <g>
    <!-- 1 identify -->
    <rect x="120" y="80" width="260" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="134" y="102" font-size="13.5" font-weight="600" fill="#1e3a8a">identify_next_batch</text>
    <text x="134" y="120" font-size="11" fill="#1e40af">sets p_batch_id and has_batch</text>

    <!-- 2 condition -->
    <rect x="120" y="156" width="260" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="134" y="178" font-size="13.5" font-weight="600" fill="#92400e">check_has_batch</text>
    <text x="134" y="196" font-size="11" fill="#b45309">if/else condition on has_batch</text>

    <!-- end -->
    <rect x="520" y="161" width="210" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="534" y="180" font-size="12.5" font-weight="600" fill="#166534">End — nothing to process</text>
    <text x="534" y="196" font-size="11" fill="#15803d">run finishes successfully</text>

    <!-- 3 create -->
    <rect x="120" y="242" width="260" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="134" y="264" font-size="13.5" font-weight="600" fill="#1e3a8a">create_new_batch</text>
    <text x="134" y="282" font-size="11" fill="#1e40af">status → in-progress</text>

    <!-- 4 bronze dim -->
    <rect x="120" y="328" width="260" height="52" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="134" y="350" font-size="13.5" font-weight="600" fill="#0f172a">run_bronze_dimensions</text>
    <text x="134" y="368" font-size="11" fill="#475569">13 reference tables · full reload</text>

    <!-- 5 bronze fact -->
    <rect x="120" y="414" width="260" height="52" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="134" y="436" font-size="13.5" font-weight="600" fill="#0f172a">run_bronze_incremental_facts</text>
    <text x="134" y="454" font-size="11" fill="#475569">6 transactional tables · one batch</text>

    <!-- 6 silver -->
    <rect x="120" y="500" width="260" height="52" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="134" y="522" font-size="13.5" font-weight="600" fill="#0f172a">run_silver</text>
    <text x="134" y="540" font-size="11" fill="#475569">19 tables · clean, conform, merge</text>

    <!-- 7 gold dim -->
    <rect x="120" y="586" width="260" height="52" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="134" y="608" font-size="13.5" font-weight="600" fill="#0f172a">run_gold_dimensions</text>
    <text x="134" y="626" font-size="11" fill="#475569">4 dimensions</text>

    <!-- 8 gold fact -->
    <rect x="120" y="672" width="260" height="52" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="134" y="694" font-size="13.5" font-weight="600" fill="#0f172a">run_gold_facts</text>
    <text x="134" y="712" font-size="11" fill="#475569">4 facts and 1 bridge</text>

    <!-- 9 complete -->
    <rect x="120" y="758" width="260" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="134" y="780" font-size="13.5" font-weight="600" fill="#1e3a8a">complete_batch</text>
    <text x="134" y="798" font-size="11" fill="#1e40af">status → completed</text>

    <!-- fail -->
    <rect x="560" y="440" width="170" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="574" y="462" font-size="13.5" font-weight="600" fill="#991b1b">fail_batch</text>
    <text x="574" y="479" font-size="11" fill="#b91c1c">runs if any task fails</text>
    <text x="574" y="493" font-size="11" fill="#b91c1c">status → failed, retries next run</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#475569">
    <rect x="30" y="836" width="14" height="12" rx="2" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="846">control</text>
    <rect x="110" y="836" width="14" height="12" rx="2" fill="#fef3c7" stroke="#d97706"/>
    <text x="130" y="846">condition</text>
    <rect x="200" y="836" width="14" height="12" rx="2" fill="#f1f5f9" stroke="#475569"/>
    <text x="220" y="846">processing</text>
    <rect x="300" y="836" width="14" height="12" rx="2" fill="#fee2e2" stroke="#dc2626"/>
    <text x="320" y="846">failure path</text>
    <text x="410" y="846">p_batch_id passes from identify_next_batch to every task below it</text>
  </g>

</svg>
